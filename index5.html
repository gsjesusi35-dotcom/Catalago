<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#12151b;--mut:#5d6573;--line:#d9dde4;--acc:#2a45ff;--on:#fff;--warn:#ff5a1f;--ok:#12a150;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--ink:#f1f3f7;--mut:#9aa3b2;--line:#2a303c;--ok:#3ddc84}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hero{padding:30px 0 16px;position:relative}
.atop{position:absolute;top:8px;right:0;background:none;border:0;color:var(--mut);opacity:.55;font:600 12px Barlow,sans-serif;padding:6px 8px;cursor:pointer;border-radius:8px}
.atop:hover,.atop:focus-visible{opacity:1}
h1{font:italic 800 clamp(38px,10vw,80px)/.92 'Barlow Condensed',Impact,sans-serif;margin:0;text-transform:uppercase}
.hero p{color:var(--mut);margin:10px 0 0;max-width:46ch}
.count{display:inline-flex;align-items:baseline;gap:8px;margin-top:14px;padding:8px 14px;border:2px solid var(--ink);border-radius:999px;font-weight:600}
.count b{font:italic 800 30px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.search,dialog input,dialog textarea{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,sans-serif}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:600 14px Barlow,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:20px 0 40px}
.card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.tile{height:200px;display:grid;place-items:center;position:relative;overflow:hidden;transition:background .4s}
.tile i{font-style:normal;font-size:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));transition:transform .3s}
.card:hover .tile i{transform:rotate(-8deg) scale(1.1)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .tile img{transform:scale(1.05)}
.badge{position:absolute;top:12px;left:12px;background:var(--warn);color:#fff;font:700 12px Barlow,sans-serif;padding:4px 10px;border-radius:999px}
.badge.out{background:#444}
.edit{position:absolute;top:12px;right:12px;z-index:2;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 12px;font:600 13px Barlow,sans-serif;cursor:pointer}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h2{font:italic 800 26px/1 'Barlow Condensed',sans-serif;margin:0;text-transform:uppercase}
.price{font:italic 800 24px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.desc{margin:0;color:var(--mut);font-size:14px}
.lbl{font-size:13px;color:var(--mut);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sz{min-width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 14px Barlow,sans-serif;cursor:pointer}
.sz.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.stock{display:flex;align-items:center;gap:10px;font-size:14px}
.meter{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter u{display:block;height:100%;background:var(--ok);transition:width .4s;border-radius:9px}
.meter u.low{background:var(--warn)}
.buy{display:flex;gap:10px;margin-top:auto}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px}
.qty button{width:36px;height:46px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.wa{flex:1;display:flex;align-items:center;justify-content:center;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;border-radius:12px;height:46px}
.wa.off{background:var(--line);color:var(--mut);pointer-events:none}
.empty,.msg{text-align:center;color:var(--mut);padding:60px 0;grid-column:1/-1}
.msg h1{color:var(--ink);margin-bottom:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1fa855;color:#fff;text-decoration:none;font-weight:600;padding:14px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
footer{text-align:center;padding:10px 0 90px}
.adm{background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ab{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:9px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
.ab.ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}
.ab.danger{background:var(--warn);color:#fff}
.mini{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:600 13px Barlow,sans-serif;cursor:pointer;margin-right:6px}
dialog{width:min(520px,94vw);max-height:90vh;border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:18px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog label,.fl{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
dialog input,dialog textarea{margin-top:4px;background:var(--bg)}
.r{display:flex;gap:8px;margin:6px 0;align-items:center}.r input{margin-top:0}
.r input[type=color]{width:52px;height:42px;padding:2px;flex:none}.r input[type=number]{width:90px;flex:none}
dialog input[type=checkbox]{width:auto;margin-right:8px}
.pv{display:block;width:120px;height:120px;object-fit:cover;border-radius:12px;margin:6px 0}
.dbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:20;font-weight:600}
.price{text-align:right}
.bs{display:block;font:600 13px Barlow,sans-serif;color:var(--mut);margin-top:3px}
.rate{margin-top:10px;font-size:13px;color:var(--mut)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer}
.nav.l{left:8px}.nav.r{right:8px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:2}
.dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);display:block}.dots b.on{background:#fff}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.ph>div{position:relative}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:10px;display:block}
.ph .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--warn);color:#fff;cursor:pointer}
.add{flex:1;height:46px;border-radius:12px;font-size:15px}
.cartbtn{position:fixed;left:16px;bottom:16px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:14px 18px;font:600 16px Barlow,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
.ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ci .t{flex:1}.ci small{display:block;color:var(--mut)}
.tot{font:italic 800 28px/1 'Barlow Condensed',sans-serif;margin:14px 0 4px}
.ticker{background:#000;color:#fff;overflow:hidden;white-space:nowrap;padding:10px 0;border-bottom:3px solid var(--acc)}
.tk{display:inline-flex;animation:mq 45s linear infinite;will-change:transform}
.tk span{padding:0 22px;font:700 14px Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tk b{color:#5dff9d;font-size:17px}
@keyframes mq{to{transform:translateX(-50%)}}
.mq{background:var(--acc);color:#fff;overflow:hidden;white-space:nowrap;border-radius:12px;margin-top:22px}
.mqt{display:inline-flex;animation:mq 40s linear infinite;will-change:transform}
.mqt span{padding:11px 26px;font:700 15px Barlow,sans-serif;letter-spacing:.03em}
@media (min-width:900px){
 .wrap{max-width:1280px;padding:0 36px}
 .hero{padding:48px 0 8px}
 h1{font-size:clamp(64px,6.5vw,100px)}
 .hero p{font-size:19px;max-width:60ch}
 .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px;padding:26px 0 60px}
 .tile{height:240px}
 .bar{display:flex;align-items:center;gap:16px}
 .bar .search{width:340px;flex:none}
 .bar .chips{padding-top:0;flex:1;flex-wrap:wrap;overflow:visible}
 dialog{width:min(660px,90vw)}
 .adm{padding:12px 36px}
 .fab{right:28px;bottom:24px}.cartbtn{left:28px;bottom:24px}
}
.body .wa{flex:none;width:100%;height:46px;font-size:15px;text-align:center}
.buy{align-items:stretch}
.buy .wa{flex:1;width:auto}
.qty{flex:none;height:46px}.qty button{width:32px;height:44px}
.add{flex:1;height:46px;min-width:0;padding:0 10px;white-space:nowrap;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Descuentos ===== */
.was{display:block;font:600 15px/1 Barlow,sans-serif;color:var(--mut);text-decoration:line-through;text-align:right;margin-bottom:4px}
.badge.off{background:#12a150;left:auto;right:12px}
.edit+.badge.off{top:52px}
.dprev{margin:-4px 0 12px;font-size:14px;color:var(--mut)}.dprev b{color:var(--ink)}
.ci small s{opacity:.8}
/* ===== Diseño profesional: portada, logo y escritorio ===== */
.hero{padding:20px 0 10px}
.atop{z-index:3}
.cover{height:clamp(150px,30vw,340px);border-radius:24px;overflow:hidden;background:var(--line);box-shadow:0 10px 30px rgba(18,21,27,.14)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.brand{display:flex;align-items:center;gap:18px}
.bt{min-width:0;flex:1}
.brand h1{font-size:clamp(34px,9vw,60px);line-height:.95;overflow-wrap:anywhere}
.hero p{margin-top:8px}
.logo{flex:none;width:84px;height:84px;border-radius:22px;object-fit:contain;background:var(--card);padding:6px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(18,21,27,.16)}
.has-cover .atop{top:34px;right:16px;background:rgba(0,0,0,.5);color:#fff;opacity:.9}
.has-cover .brand{margin-top:16px}
.has-cover.has-logo .brand{margin-top:0;align-items:flex-start;padding:0 14px}
.has-cover.has-logo .logo{width:92px;height:92px;margin-top:-46px;border:4px solid var(--bg);padding:4px}
.has-cover.has-logo .bt{padding-top:14px}
.bar{background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card{box-shadow:0 2px 10px rgba(18,21,27,.06);animation:pop .35s ease backwards;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(18,21,27,.14)}
.chip{transition:background .2s,border-color .2s}.chip:hover{border-color:var(--ink)}
.lgp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0}
.lgp input[type=file]{flex:1;min-width:180px}
.lgp img.l{width:72px;height:72px;object-fit:contain;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.lgp img.c{width:100%;max-width:340px;aspect-ratio:1600/560;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
@media (min-width:900px){
 .hero{padding:30px 0 14px}
 .cover{height:clamp(240px,24vw,360px);border-radius:28px}
 .brand{gap:26px}
 .brand h1{font-size:clamp(46px,4.6vw,78px)}
 .hero p{font-size:19px;max-width:62ch}
 .logo{width:116px;height:116px;border-radius:28px;padding:8px}
 .has-cover.has-logo .logo{width:132px;height:132px;margin-top:-66px;border-width:5px}
 .has-cover.has-logo .brand{padding:0 28px}
 .has-cover.has-logo .bt{padding-top:18px}
 .has-cover .atop{top:42px;right:24px}
 .count{margin-top:18px}
 .bar{border-radius:0 0 16px 16px;padding:12px 0}
}
@media (min-width:1500px){
 .wrap{max-width:1440px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
}
/* ===== Encabezado centrado ===== */
.brand,.has-cover.has-logo .brand{flex-direction:column;align-items:center;text-align:center;gap:10px;padding:0}
.bt,.has-cover.has-logo .bt{flex:none;width:100%;min-width:0;padding-top:0;display:flex;flex-direction:column;align-items:center}
.has-cover.has-logo .logo{margin-top:-52px}
.brand h1{white-space:nowrap;font-size:clamp(20px,6.4vw,64px);line-height:1.05;letter-spacing:.01em;max-width:none;overflow-wrap:normal}
.hero p{margin:8px auto 0;max-width:56ch;font-size:16px;line-height:1.55;text-wrap:balance;text-align:center}
@media (min-width:900px){
 .brand,.has-cover.has-logo .brand{gap:14px;padding:0}
 .has-cover.has-logo .logo{margin-top:-72px}
 .brand h1{font-size:clamp(34px,3.6vw,60px)}
 .hero p{font-size:18px;max-width:64ch}
}

/* ===== Tarjetas compactas (2 por fila) + ficha completa ===== */
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 0 40px}
.card.mini{cursor:pointer}
.card.mini .tile{height:150px}
.card.mini .tile i{font-size:60px}
.card.mini .body{padding:10px 12px 12px;gap:4px}
.card.mini h2{font-size:20px;line-height:1.05}
.card.mini .top{flex-direction:column;gap:2px}
.card.mini .price{text-align:left;font-size:21px}
.card.mini .was{text-align:left;margin-bottom:2px;font-size:13px}
.card.mini .bs{font-size:12px}
.card.mini .badge{top:8px;left:8px;font-size:11px;padding:3px 8px}
.card.mini .badge.off{left:auto;right:8px}
.card.mini .edit{top:8px;right:8px;padding:5px 9px;font-size:12px}
.card.mini .edit+.badge.off{top:42px}
#pdlg{padding:0;width:min(520px,94vw)}
#pdlg .card{border:0;border-radius:0;box-shadow:none;animation:none;transform:none!important}
#pdlg .tile{height:min(320px,48vh)}
#pdlg .pclose{position:sticky;top:0;float:right;z-index:6;margin:10px 10px -46px 0;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
#ptoast{position:sticky;bottom:12px;margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;text-align:center}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
@media (min-width:900px){
 .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
 .card.mini .tile{height:220px}
 .card.mini h2{font-size:24px}
 #pdlg{width:min(640px,90vw)}
}

/* ===== Nombres sobrios, tarjetas más bajas, código y envío ===== */
.card h2{font:600 19px/1.2 Barlow,system-ui,sans-serif;text-transform:none;font-style:normal;letter-spacing:0;margin:0}
.card.mini h2{font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card.mini .tile{height:140px}
.card.mini .body{padding:10px 11px 12px;gap:3px}
.card.mini .price{font-size:19px}
.card.mini .was{font-size:12px;margin-bottom:1px}
.card.mini .bs{font-size:11.5px;margin-top:1px}
.pc{display:block;font:500 12px/1.2 Barlow,sans-serif;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcode{display:inline-block;font:600 13px Barlow,sans-serif;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;align-self:flex-start}
.deliv{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:10px;padding:8px 12px}
.card.mini .dl{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font:600 11px Barlow,sans-serif;padding:3px 8px;border-radius:999px;z-index:1}
@media (min-width:900px){.card.mini h2{font-size:16.5px}.card.mini .tile{height:210px}}
#pdlg .body{padding:16px 18px 20px;gap:14px}
#pdlg .buy{margin-top:6px}
#pdlg .body .wa{margin-top:0}
dialog select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,sans-serif}
#shipbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sh-h{margin:0 0 10px;font:700 16px Barlow,sans-serif}
.sh-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sh-t{padding:11px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:600 13px Barlow,sans-serif;cursor:pointer}
.sh-t.on{border-color:var(--acc);color:var(--acc)}
#shipbox .mini{margin-bottom:6px}
button.wa{border:0;cursor:pointer;font:600 15px Barlow,sans-serif}
#s_err{color:#d92d20;font-weight:600;margin:8px 0 0}
/* ===== Fotos de producto: sin recortes + ampliar ===== */
.tile.hasimg{background:#fff!important}
.tile img{object-fit:contain;background:#fff}
.card:hover .tile img{transform:scale(1.03)}
.card.mini .tile{height:auto;aspect-ratio:1/1}
#pdlg .tile{height:auto;aspect-ratio:1/1;max-height:min(560px,62vh);cursor:zoom-in}
.ph img{object-fit:contain;background:#fff;border:1px solid var(--line)}
.zh{position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font:600 12px Barlow,sans-serif;padding:4px 10px;border-radius:999px;pointer-events:none}
.ghint{margin:2px 0 8px;font-size:13px;line-height:1.4;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ghint b{color:var(--ink)}
#zdlg{position:fixed;inset:0;margin:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;padding:0;border-radius:0;background:#000;overflow:hidden}
#zdlg::backdrop{background:#000}
.zbox{width:100%;height:100%;overflow:auto;display:grid;-webkit-overflow-scrolling:touch}
.zbox img{margin:auto;max-width:100vw;max-height:100vh;max-height:100dvh;cursor:zoom-in;user-select:none;-webkit-user-select:none;background:#fff}
.zbox.z img{max-width:none;max-height:none;height:auto;cursor:zoom-out}
.zx,.znav{position:absolute;z-index:3;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.zx{top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:42px;height:42px;font-size:18px}
.znav{top:50%;transform:translateY(-50%);width:44px;height:44px;font-size:26px}
.zl{left:10px}.zr{right:10px}
.zct{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font:600 13px Barlow,sans-serif;z-index:3;pointer-events:none;text-shadow:0 1px 4px #000}
/* ===== Precio al detal / al mayor ===== */
.pl{display:block;font:700 11px/1 Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.price .pl{text-align:inherit}
.card.mini .top.two{gap:7px}.card.mini .top.two .price{font-size:17px}

function inner(p){
  const s=S[p.id],st=s.sz?p.sizes[s.sz]:0,col=p.colors[s.c]||["","#dfe3ea","#f1f3f7"],low=st>0&&st<=3;

  return `<div class="tile${p.imgs.length?' hasimg':''}" style="background:linear-gradient(135deg,${col[1]},${col[2]})">${p.imgs.length?`<img src="${esc(p.imgs[s.i%p.imgs.length])}" alt="${esc(p.name)}" decoding="async"><span class="zh">🔍 Toca para ampliar</span>${p.imgs.length>1?`<button class="nav l" data-a="ph" data-v="-1" aria-label="Anterior">‹</button><button class="nav r" data-a="ph" data-v="1" aria-label="Siguiente">›</button><div class="dots">${p.imgs.map((u,k)=>`<b class="${k===s.i%p.imgs.length?'on':''}"></b>`).join("")}</div>`:""}`:`<i>${esc(p.icon||"🏷️")}</i>`}
   ${!p.active?'<span class="badge out">Oculto</span>':!s.sz?'<span class="badge out">Agotado</span>':low?`<span class="badge">¡Últimas ${st}!</span>`:''}${ADMIN?'<button class="edit" data-a="e">✏️ Editar</button>':''}${dd(p,s.t)?`<span class="badge off">−${dd(p,s.t)}%</span>`:''}</div>

  ${p.code?`<span class="pcode">Código: ${esc(p.code)}</span>`:""}

  ${isNo(p)?"":`<div><span class="lbl">${esc(OL())}</span><div class="row">${Object.entries(p.sizes).map(([k,v])=>`<button class="sz ${k===s.sz?'on':''}" data-a="s" data-v="${esc(k)}" ${v?'':'disabled title="Agotado"'}>${esc(k)}</button>`).join("")}</div></div>`}
  ${st>=9999?"":`<div class="stock"><span><b>${st}</b> disponibles</span><div class="meter"><u class="${low?'low':''}" style="width:${Math.min(100,st/12*100)}%"></u></div></div>`}
  <div class="buy"><div class="qty"><button data-a="m" aria-label="Menos">−</button><span>${s.q}</span><button data-a="p" aria-label="Más">+</button></div>
  ${s.sz?'<button class="ab add" data-a="add" aria-label="Agregar al carrito">🛒 Agregar</button>':'<a class="wa off">Sin stock</a>'}</div>
  ${s.sz?`<button class="wa" data-a="buy">Comprar ahora por WhatsApp</button>`:''}</div>`;
}
function miniCard(p){
  const s=S[p.id],st=s.sz?p.sizes[s.sz]:0,col=p.colors[s.c]||["","#dfe3ea","#f1f3f7"],low=st>0&&st<=3;
  return `<div class="tile${p.imgs.length?' hasimg':''}" style="background:linear-gradient(135deg,${col[1]},${col[2]})">${p.imgs.length?`<img src="${esc(p.imgs[0])}" alt="${esc(p.name)}" loading="lazy" decoding="async">`:`<i>${esc(p.icon||"🏷️")}</i>`}
   ${!p.active?'<span class="badge out">Oculto</span>':!s.sz?'<span class="badge out">Agotado</span>':low?`<span class="badge">¡Últimas ${st}!</span>`:''}${ADMIN?'<button class="edit" data-a="e">✏️ Editar</button>':''}${dcm(p)?`<span class="badge off">−${dcm(p)}%</span>`:''}${p.delivery?'<span class="dl">🚚 Delivery</span>':''}</div>
  <div class="body"><h2>${esc(p.name)}</h2>${p.code?`<span class="pc">Cód. ${esc(p.code)}</span>`:""}<div class="top${tiers(p).length>1?' two':''}">${tiers(p).length>1?tiers(p).map(t=>pbox(p,t,true)).join(""):pbox(p,tiers(p)[0],!hasD(p))}</div></div>`;

  const b=e.target.closest("[data-a]");

  if(a==="buy"){openBuy(p);return}
  if(a==="ph"){const n=p.imgs.length;s.i=((s.i||0)+ +b.dataset.v+n)%n}

let Z=null,tx=0,ty=0;
function zShow(){const p=Z.p,n=p.imgs.length,im=$("zimg");$("zbox").classList.remove("z");im.style.width="";im.src=p.imgs[Z.i];im.alt=p.name;
  $("zct").textContent=(n>1?(Z.i+1)+" / "+n+" · ":"")+"toca la foto para acercar";document.querySelectorAll(".znav").forEach(b=>b.hidden=n<2)}

function zGo(d){const n=Z.p.imgs.length;Z.i=(Z.i+d+n)%n;zShow()}
function zToggle(e){const box=$("zbox"),im=$("zimg");
  if(box.classList.contains("z")){box.classList.remove("z");im.style.width="";box.scrollTo(0,0);return}
  const r=im.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height,
    W=Math.max(box.clientWidth*1.8,Math.min(im.naturalWidth||0,box.clientWidth*3)),H=W*((im.naturalHeight/im.naturalWidth)||1);
  box.classList.add("z");im.style.width=W+"px";box.scrollLeft=fx*W-box.clientWidth/2;box.scrollTop=fy*H-box.clientHeight/2}
$("zx").onclick=()=>$("zdlg").close();

async function loadProducts(){
  step("3/3 productos");
  const col=collection(db,"stores",store.id,"products");
  const r=await getDocs(OWNER?col:query(col,where("active","==",true)));
  P=r.docs.map(d=>{const x=d.data();return {...x,id:d.id,colors:(x.colors||[]).map(c=>[c.n,c.c1,c.c2]),sizes:x.sizes||{},created:x.created||0,imgs:(x.images&&x.images.length)?x.images:(x.image_url?[x.image_url]:[])}}).sort((a,b)=>a.created-b.created);
  P.forEach(initS);chips();render();fitName();
  const T=P.filter(p=>p.active).reduce((a,p)=>a+total(p),0);
  if(counted){$("total").textContent=T;return}counted=true;let n=0;
  const t=setInterval(()=>{n+=Math.ceil(T/30)||1;if(n>=T){n=T;clearInterval(t)}$("total").textContent=n},35);
}

const hasM=p=>Number(p.wprice)>0&&(p.pmode==="mayor"||p.pmode==="ambos");
const hasD=p=>!(p.pmode==="mayor"&&Number(p.wprice)>0);
const tiers=p=>[...(hasD(p)?["d"]:[]),...(hasM(p)?["m"]:[])];
const tOf=(p,t)=>{const a=tiers(p);return a.includes(t)?t:a[0]};
const up=(p,t)=>tOf(p,t)==="m"?Number(p.wprice):pp(p);
const dd=(p,t)=>tOf(p,t)==="d"?dc(p):0;
const dcm=p=>hasD(p)?dc(p):0;
// Un bloque de precio: etiqueta (si hace falta), precio anterior tachado (solo detal con descuento), precio y Bs.
const pbox=(p,t,lbl)=>`<div class="price">${lbl?`<span class="pl">${TL[t]}</span>`:""}${t==="d"&&dc(p)?`<s class="was">${fmt(p.price)}</s>`:""}${fmt(up(p,t))}<span class="bs">${bs(up(p,t))}</span></div>`;
const priceLine=(p,t,q)=>t==="m"?`• Precio al mayor: ${fmt(up(p,t))} c/u\n`:dc(p)?`• Precio${hasM(p)?" al detal":""}: ${fmt(pp(p))} (antes ${fmt(p.price)}, −${dc(p)}%)\n`:hasM(p)?`• Precio al detal: ${fmt(pp(p))} c/u\n`:"";
// Fecha y día según hora de Venezuela
const todayVE=()=>new Date().toLocaleDateString("en-CA",{timeZone:"America/Caracas"});
const isWk=()=>{const w=new Date().toLocaleDateString("en-US",{timeZone:"America/Caracas",weekday:"short"});return w==="Sat"||w==="Sun"};
function nextDow(dow){const d=new Date(todayVE()+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+((dow-d.getUTCDay()+7)%7));return d.toISOString().slice(0,10)}
function loadRC(x){x=x||{};RC={mode:x.rateMode==="manual"?"manual":"auto",manual:+x.rateManual||0,next:+x.rateNext||0,nextFrom:x.rateNextFrom||"",upd:x.rateUpdated||""}}
const manualOn=()=>RC.mode==="manual"&&RC.manual>0;
// Qué tasa corresponde hoy: manual (con tasa programada) o automática del BCV
function calcRate(){
  const wk=isWk();
  if(manualOn()){
    let r=RC.manual,d=RC.upd,l="Tasa del día";
    if(RC.next>0&&RC.nextFrom&&todayVE()>=RC.nextFrom){r=RC.next;d=RC.nextFrom;if(wk)l="Tasa del lunes (fin de semana)"}
    return {r,d,l,n:"Tasa"}}
  return {r:AUTO.r,d:AUTO.d,l:wk?"Tasa BCV vigente (fin de semana)":"Tasa BCV de hoy",n:"Tasa BCV"}
}
function showRate(){
  const t=$("tick");
  if(!rate){t.hidden=true;return}
  const one="<span>💱 "+esc(rateLbl)+"</span><span><b>Bs. "+nf(rate)+"</b> por 1 US$</span>"+(rateDate?"<span>Actualizada "+fd(rateDate)+"</span>":"")+"<span>✦</span>";
  $("tk").innerHTML=one.repeat(8);t.hidden=false;
}
function applyRate(force){const x=calcRate(),ch=x.r!==rate||x.l!==rateLbl;rate=x.r;rateDate=x.d;rateLbl=x.l;rateName=x.n;
  if(ch||force)showRate();
  if(ch||force){if(P.length)render();cartUI();if($("cdlg").open)drawCart()}}
async function getJ(u,pick){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});return pick(await r.json())}finally{clearTimeout(t)}}
async function fetchAuto(){
  let g=null;
  try{g=await getJ("https://ve.dolarapi.com/v1/dolares/oficial",j=>({r:+j.promedio,d:String(j.fechaActualizacion||"").slice(0,10)}))}catch(e){}
  if(!g||!(g.r>0)){try{g=await getJ("https://chitty400.github.io/chitty-bcv-api/latest.json",j=>({r:+j.tasa_bcv,d:String(j.updated_at||"").slice(0,10)}))}catch(e){}}
  if(g&&g.r>0){AUTO=g;try{localStorage.setItem("rate",JSON.stringify(g))}catch(e){}}
}
async function loadRate(){
  loadRC(store);applyRate(true);lastRate=Date.now();
  if(!manualOn()){await fetchAuto();applyRate(true)}
}
// Se vuelve a leer la tasa (lo que puso el administrador y la del BCV) cada 30 min y al volver a la página
async function refreshRate(){
  lastRate=Date.now();
  try{const sn=await getDoc(doc(db,"stores",store.id));if(sn.exists())loadRC(sn.data())}catch(e){}

}

function addCart(p,s){
  const col=p.colors.length?(p.colors[s.c]||[""])[0]:"",max=p.sizes[s.sz]||0,t=tOf(p,s.t),same=CART.filter(x=>x.id===p.id&&x.c===col&&x.s===s.sz),it=same.find(x=>tOf(p,x.t)===t),nq=same.reduce((a,x)=>a+x.q,0)+s.q;

function shipData(){return {modo:SH.m,nombre:sv("s_nom"),telefono:sv("s_tel"),...(SH.m==="nacional"?{empresa:sv("s_emp"),cedula:sv("s_ced"),estado:sv("s_est"),ciudad:sv("s_ciu"),oficina:sv("s_ofi")}:SH.m==="delivery"?{direccion:sv("s_dir"),referencia:sv("s_ref"),gps:SH.gps?SH.gps.lat+","+SH.gps.lng:""}:{})}}
function orderItems(buy){
  const row=(p,t,q,c,sz)=>({id:p.id,nombre:p.name,codigo:p.code||"",color:c||"",opcion:sz===NOOPT?"":(sz||""),cantidad:q,tipo:hasM(p)?TL[t]:"",precio:up(p,t),subtotal:Math.round(up(p,t)*q*100)/100});

async function createOrder(items){
  const cref=doc(db,"stores",store.id,"counters","orders"),pre=orderPrefix(),total=Math.round(items.reduce((a,x)=>a+x.subtotal,0)*100)/100,envio=shipData();
  return runTransaction(db,async tx=>{
    const sn=await tx.get(cref),n=(sn.exists()?(+sn.data().n||0):0)+1,num=pre+"-"+String(n).padStart(4,"0");
    tx.set(cref,{n});
    tx.set(doc(db,"stores",store.id,"orders",num),{numero:num,seq:n,creado:Date.now(),estado:"nuevo",moneda:store.currency||"$",tasa:rate||0,total,items,envio});
    return num;
  });

let sending=false;
async function sendOrder(e,buy){
  e.preventDefault();
  if(sending)return;
  const er=shipErr();if(er){shipFail(er);return}
  sending=true;
  const btn=e.currentTarget,old=btn.textContent;btn.textContent="Generando pedido…";
  const w=window.open("","_blank");
  let num="";
  try{num=await createOrder(orderItems(buy))}
  catch(err){console.warn("Orden no registrada",err);toast("No se pudo generar el número de orden; se envía el pedido igual",4500)}
  const url=link(buy?buyMsg(buy,num):msgCart(num));
  if(w)w.location.href=url;else location.href=url;
  btn.textContent=old;sending=false;
  if(num){if(buy)$("bdlg").close();else{CART=[];saveCart();drawCart();$("cdlg").close()}toast("Pedido "+num+" enviado ✔",4000)}
}

  catch(err){$("obody").innerHTML='<h2>📦 Pedidos</h2><p class="desc">No se pudieron cargar los pedidos ('+esc(err.code||err.message)+'). Revisa las reglas de Firestore.</p>'}

async function delOrder(id){
  const o=ORD.find(x=>x.id===id);if(!o)return;
  const cref=doc(db,"stores",store.id,"counters","orders"),oref=doc(db,"stores",store.id,"orders",id);
  const has=new Set(ORD.filter(x=>x.id!==id).map(x=>x.seq)),min=Math.min(...ORD.map(x=>x.seq)),full=ORD.length>=500;
  let freed=false;
  await runTransaction(db,async tx=>{
    const sn=await tx.get(cref),n=sn.exists()?(+sn.data().n||0):0;
    tx.delete(oref);
    if(n===o.seq){let k=o.seq-1;while(k>0&&!has.has(k)&&(k>=min||!full))k--;tx.set(cref,{n:k});freed=true}
  });
  ORD=ORD.filter(x=>x.id!==id);
  ONOTE=freed?"Pedido "+(o.numero||id)+" eliminado. Ese número queda libre para el próximo pedido.":"Pedido "+(o.numero||id)+" eliminado. Su número queda sin usar porque ya hay pedidos posteriores.";
  drawOrders();
}
$("obody").addEventListener("click",async e=>{const x=e.target.closest("[data-x]");if(x){x.dataset.x==="csv"?csvOrders():printOrders();return}const b=e.target.closest("[data-del]");if(!b)return;
  if(!b.dataset.s){b.dataset.s=1;b.textContent="¿Seguro? Toca otra vez";return}
  b.disabled=true;
  try{await delOrder(b.dataset.del)}catch(err){b.disabled=false;alert("No se pudo eliminar: "+(err.code||err.message))}});
function csvOrders(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',n2=v=>String(Math.round((+v||0)*100)/100).replace(".",","),T="America/Caracas";
  const H=["N.º orden","Fecha","Hora","Estado","Cliente","Teléfono","Modalidad","Empresa de envío","Cédula/RIF","Destino / dirección","Referencia","Producto","Código","Color","Opción","Tipo de precio","Cantidad","Precio unitario","Subtotal","Total del pedido","Moneda","Tasa Bs"];
  const R=[H.map(q).join(";")];
  OV().slice().reverse().forEach(o=>{const e=o.envio||{},d=new Date(o.creado||0),mod=e.modo==="nacional"?"Envío nacional":e.modo==="delivery"?"Delivery":"Pick up",
    dest=e.modo==="nacional"?[e.ciudad,e.estado,e.oficina].filter(Boolean).join(", "):e.modo==="delivery"?(e.direccion||""):"";
    (o.items&&o.items.length?o.items:[{}]).forEach((x,i)=>R.push([o.numero||o.id,d.toLocaleDateString("es",{timeZone:T,day:"2-digit",month:"2-digit",year:"numeric"}),d.toLocaleTimeString("es",{timeZone:T,hour:"2-digit",minute:"2-digit"}),OST[o.estado||"nuevo"],e.nombre||"",e.telefono||"",mod,e.empresa||"",e.cedula||"",dest,e.referencia||"",x.nombre||"",x.codigo||"",x.color||"",x.opcion||"",x.tipo||"",x.cantidad||"",x.precio!=null?n2(x.precio):"",x.subtotal!=null?n2(x.subtotal):"",i?"":n2(o.total),o.moneda||"$",o.tasa?n2(o.tasa):""].map(q).join(";")))});
  const bl=new Blob(["﻿"+R.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(bl);a.download="pedidos-"+store.id+"-"+todayVE()+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function printOrders(){
  const l=OV().slice().reverse(),m=store.currency||"$",w=window.open("","_blank");
  if(!w){alert("Tu navegador bloqueó la ventana. Permite ventanas emergentes para imprimir.");return}
  const rows=l.map(o=>{const e=o.envio||{},st=o.estado||"nuevo";
    const it=(o.items||[]).map(x=>esc(x.cantidad+" × "+x.nombre+[x.color,x.opcion,x.codigo].filter(Boolean).map(v=>" · "+v).join(""))).join("<br>");
    return `<tr><td><b>${esc(o.numero||o.id)}</b></td><td>${esc(fdt(o.creado))}</td><td>${esc(e.nombre||"")}<br>${esc(e.telefono||"")}</td><td>${esc(entTxt(e))}</td><td>${it}</td><td>${esc(OST[st])}</td><td class="r">${m}${nf(o.total||0)}</td></tr>`}).join("");
  const fl=[OF.d?"desde "+OF.d.split("-").reverse().join("/"):"",OF.h?"hasta "+OF.h.split("-").reverse().join("/"):"",OF.e?"estado "+OST[OF.e]:""].filter(Boolean).join(" · ")||"todos los pedidos";
  w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Pedidos ${esc(store.name)}</title><style>body{font:13px/1.4 Arial,sans-serif;color:#000;margin:20px}h1{font-size:20px;margin:0 0 4px}.m{color:#444;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}th{background:#eee}tr{page-break-inside:avoid}.r{text-align:right;white-space:nowrap}</style></head><body><h1>${esc(store.name)} · Pedidos</h1><p class="m">${esc(fl)} · ${l.length} pedido(s) · Generado ${esc(fdt(Date.now()))}</p><table><thead><tr><th>N.º</th><th>Fecha</th><th>Cliente</th><th>Entrega</th><th>Productos</th><th>Estado</th><th class="r">Total</th></tr></thead><tbody>${rows||'<tr><td colspan="7">Sin pedidos</td></tr>'}</tbody><tfoot><tr><td colspan="6" class="r"><b>Total (sin cancelados)</b></td><td class="r"><b>${m}${nf(osum(l))}</b></td></tr></tfoot></table></body></html>`);
  w.document.close();w.focus();setTimeout(()=>w.print(),400);
}
