<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#12151b;--mut:#5d6573;--line:#d9dde4;--acc:#2a45ff;--on:#fff;--warn:#ff5a1f;--ok:#12a150;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--ink:#f1f3f7;--mut:#9aa3b2;--line:#2a303c;--ok:#3ddc84}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hero{padding:30px 0 16px;position:relative}
.atop{position:absolute;top:8px;right:0;background:none;border:0;color:var(--mut);opacity:.55;font:600 12px Barlow,sans-serif;padding:6px 8px;cursor:pointer;border-radius:8px}
.atop:hover,.atop:focus-visible{opacity:1}
h1{font:italic 800 clamp(38px,10vw,80px)/.92 'Barlow Condensed',Impact,sans-serif;margin:0;text-transform:uppercase}
.hero p{color:var(--mut);margin:10px 0 0;max-width:46ch}
.count{display:inline-flex;align-items:baseline;gap:8px;margin-top:14px;padding:8px 14px;border:2px solid var(--ink);border-radius:999px;font-weight:600}
.count b{font:italic 800 30px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.search,dialog input,dialog textarea{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,sans-serif}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:600 14px Barlow,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:20px 0 40px}
.card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.tile{height:200px;display:grid;place-items:center;position:relative;overflow:hidden;transition:background .4s}
.tile i{font-style:normal;font-size:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));transition:transform .3s}
.card:hover .tile i{transform:rotate(-8deg) scale(1.1)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .tile img{transform:scale(1.05)}
.badge{position:absolute;top:12px;left:12px;background:var(--warn);color:#fff;font:700 12px Barlow,sans-serif;padding:4px 10px;border-radius:999px}
.badge.out{background:#444}
.edit{position:absolute;top:12px;right:12px;z-index:2;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 12px;font:600 13px Barlow,sans-serif;cursor:pointer}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h2{font:italic 800 26px/1 'Barlow Condensed',sans-serif;margin:0;text-transform:uppercase}
.price{font:italic 800 24px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.desc{margin:0;color:var(--mut);font-size:14px}
.lbl{font-size:13px;color:var(--mut);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sz{min-width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 14px Barlow,sans-serif;cursor:pointer}
.sz.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.stock{display:flex;align-items:center;gap:10px;font-size:14px}
.meter{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter u{display:block;height:100%;background:var(--ok);transition:width .4s;border-radius:9px}
.meter u.low{background:var(--warn)}
.buy{display:flex;gap:10px;margin-top:auto}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px}
.qty button{width:36px;height:46px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.wa{flex:1;display:flex;align-items:center;justify-content:center;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;border-radius:12px;height:46px}
.wa.off{background:var(--line);color:var(--mut);pointer-events:none}
.empty,.msg{text-align:center;color:var(--mut);padding:60px 0;grid-column:1/-1}
.msg h1{color:var(--ink);margin-bottom:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1fa855;color:#fff;text-decoration:none;font-weight:600;padding:14px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
footer{text-align:center;padding:10px 0 90px}
.adm{background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ab{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:9px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
.ab.ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}
.ab.danger{background:var(--warn);color:#fff}
.mini{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:600 13px Barlow,sans-serif;cursor:pointer;margin-right:6px}
dialog{width:min(520px,94vw);max-height:90vh;border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:18px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog label,.fl{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
dialog input,dialog textarea{margin-top:4px;background:var(--bg)}
.r{display:flex;gap:8px;margin:6px 0;align-items:center}.r input{margin-top:0}
.r input[type=color]{width:52px;height:42px;padding:2px;flex:none}.r input[type=number]{width:90px;flex:none}
dialog input[type=checkbox]{width:auto;margin-right:8px}
.pv{display:block;width:120px;height:120px;object-fit:cover;border-radius:12px;margin:6px 0}
.dbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:20;font-weight:600}
.price{text-align:right}
.bs{display:block;font:600 13px Barlow,sans-serif;color:var(--mut);margin-top:3px}
.rate{margin-top:10px;font-size:13px;color:var(--mut)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer}
.nav.l{left:8px}.nav.r{right:8px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:2}
.dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);display:block}.dots b.on{background:#fff}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.ph>div{position:relative}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:10px;display:block}
.ph .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--warn);color:#fff;cursor:pointer}
.add{flex:1;height:46px;border-radius:12px;font-size:15px}
.cartbtn{position:fixed;left:16px;bottom:16px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:14px 18px;font:600 16px Barlow,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
.ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ci .t{flex:1}.ci small{display:block;color:var(--mut)}
.tot{font:italic 800 28px/1 'Barlow Condensed',sans-serif;margin:14px 0 4px}
.ticker{background:#000;color:#fff;overflow:hidden;white-space:nowrap;padding:10px 0;border-bottom:3px solid var(--acc)}
.tk{display:inline-flex;animation:mq 45s linear infinite;will-change:transform}
.tk span{padding:0 22px;font:700 14px Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tk b{color:#5dff9d;font-size:17px}
@keyframes mq{to{transform:translateX(-50%)}}
.mq{background:var(--acc);color:#fff;overflow:hidden;white-space:nowrap;border-radius:12px;margin-top:22px}
.mqt{display:inline-flex;animation:mq 40s linear infinite;will-change:transform}
.mqt span{padding:11px 26px;font:700 15px Barlow,sans-serif;letter-spacing:.03em}
@media (min-width:900px){
 .wrap{max-width:1280px;padding:0 36px}
 .hero{padding:48px 0 8px}
 h1{font-size:clamp(64px,6.5vw,100px)}
 .hero p{font-size:19px;max-width:60ch}
 .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px;padding:26px 0 60px}
 .tile{height:240px}
 .bar{display:flex;align-items:center;gap:16px}
 .bar .search{width:340px;flex:none}
 .bar .chips{padding-top:0;flex:1;flex-wrap:wrap;overflow:visible}
 dialog{width:min(660px,90vw)}
 .adm{padding:12px 36px}
 .fab{right:28px;bottom:24px}.cartbtn{left:28px;bottom:24px}
}
.body .wa{flex:none;width:100%;height:46px;font-size:15px;text-align:center}
.buy{align-items:stretch}
.buy .wa{flex:1;width:auto}
.qty{flex:none;height:46px}.qty button{width:32px;height:44px}
.add{flex:1;height:46px;min-width:0;padding:0 10px;white-space:nowrap;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Descuentos ===== */
.was{display:block;font:600 15px/1 Barlow,sans-serif;color:var(--mut);text-decoration:line-through;text-align:right;margin-bottom:4px}
.badge.off{background:#12a150;left:auto;right:12px}
.edit+.badge.off{top:52px}
.dprev{margin:-4px 0 12px;font-size:14px;color:var(--mut)}.dprev b{color:var(--ink)}
.ci small s{opacity:.8}
/* ===== Diseño profesional: portada, logo y escritorio ===== */
.hero{padding:20px 0 10px}
.atop{z-index:3}
.cover{height:clamp(150px,30vw,340px);border-radius:24px;overflow:hidden;background:var(--line);box-shadow:0 10px 30px rgba(18,21,27,.14)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.brand{display:flex;align-items:center;gap:18px}
.bt{min-width:0;flex:1}
.brand h1{font-size:clamp(34px,9vw,60px);line-height:.95;overflow-wrap:anywhere}
.hero p{margin-top:8px}
.logo{flex:none;width:84px;height:84px;border-radius:22px;object-fit:contain;background:var(--card);padding:6px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(18,21,27,.16)}
.has-cover .atop{top:34px;right:16px;background:rgba(0,0,0,.5);color:#fff;opacity:.9}
.has-cover .brand{margin-top:16px}
.has-cover.has-logo .brand{margin-top:0;align-items:flex-start;padding:0 14px}
.has-cover.has-logo .logo{width:92px;height:92px;margin-top:-46px;border:4px solid var(--bg);padding:4px}
.has-cover.has-logo .bt{padding-top:14px}
.bar{background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card{box-shadow:0 2px 10px rgba(18,21,27,.06);animation:pop .35s ease backwards;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(18,21,27,.14)}
.chip{transition:background .2s,border-color .2s}.chip:hover{border-color:var(--ink)}
.lgp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0}
.lgp input[type=file]{flex:1;min-width:180px}
.lgp img.l{width:72px;height:72px;object-fit:contain;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.lgp img.c{width:100%;max-width:340px;aspect-ratio:1600/560;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
@media (min-width:900px){
 .hero{padding:30px 0 14px}
 .cover{height:clamp(240px,24vw,360px);border-radius:28px}
 .brand{gap:26px}
 .brand h1{font-size:clamp(46px,4.6vw,78px)}
 .hero p{font-size:19px;max-width:62ch}
 .logo{width:116px;height:116px;border-radius:28px;padding:8px}
 .has-cover.has-logo .logo{width:132px;height:132px;margin-top:-66px;border-width:5px}
 .has-cover.has-logo .brand{padding:0 28px}
 .has-cover.has-logo .bt{padding-top:18px}
 .has-cover .atop{top:42px;right:24px}
 .count{margin-top:18px}
 .bar{border-radius:0 0 16px 16px;padding:12px 0}
}
@media (min-width:1500px){
 .wrap{max-width:1440px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
}
/* ===== Encabezado centrado ===== */
.brand,.has-cover.has-logo .brand{flex-direction:column;align-items:center;text-align:center;gap:10px;padding:0}
.bt,.has-cover.has-logo .bt{flex:none;width:100%;min-width:0;padding-top:0;display:flex;flex-direction:column;align-items:center}
.has-cover.has-logo .logo{margin-top:-52px}
.brand h1{white-space:nowrap;font-size:clamp(20px,6.4vw,64px);line-height:1.05;letter-spacing:.01em;max-width:none;overflow-wrap:normal}
.hero p{margin:8px auto 0;max-width:56ch;font-size:16px;line-height:1.55;text-wrap:balance;text-align:center}
@media (min-width:900px){
 .brand,.has-cover.has-logo .brand{gap:14px;padding:0}
 .has-cover.has-logo .logo{margin-top:-72px}
 .brand h1{font-size:clamp(34px,3.6vw,60px)}
 .hero p{font-size:18px;max-width:64ch}
}

/* ===== Tarjetas compactas (2 por fila) + ficha completa ===== */
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 0 40px}
.card.mini{cursor:pointer}
.card.mini .tile{height:150px}
.card.mini .tile i{font-size:60px}
.card.mini .body{padding:10px 12px 12px;gap:4px}
.card.mini h2{font-size:20px;line-height:1.05}
.card.mini .top{flex-direction:column;gap:2px}
.card.mini .price{text-align:left;font-size:21px}
.card.mini .was{text-align:left;margin-bottom:2px;font-size:13px}
.card.mini .bs{font-size:12px}
.card.mini .badge{top:8px;left:8px;font-size:11px;padding:3px 8px}
.card.mini .badge.off{left:auto;right:8px}
.card.mini .edit{top:8px;right:8px;padding:5px 9px;font-size:12px}
.card.mini .edit+.badge.off{top:42px}
#pdlg{padding:0;width:min(520px,94vw)}
#pdlg .card{border:0;border-radius:0;box-shadow:none;animation:none;transform:none!important}
#pdlg .tile{height:min(320px,48vh)}
#pdlg .pclose{position:sticky;top:0;float:right;z-index:6;margin:10px 10px -46px 0;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
#ptoast{position:sticky;bottom:12px;margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;text-align:center}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
@media (min-width:900px){
 .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
 .card.mini .tile{height:220px}
 .card.mini h2{font-size:24px}
 #pdlg{width:min(640px,90vw)}
}

/* ===== Nombres sobrios, tarjetas más bajas, código y envío ===== */
.card h2{font:600 19px/1.2 Barlow,system-ui,sans-serif;text-transform:none;font-style:normal;letter-spacing:0;margin:0}
.card.mini h2{font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card.mini .tile{height:140px}
.card.mini .body{padding:10px 11px 12px;gap:3px}
.card.mini .price{font-size:19px}
.card.mini .was{font-size:12px;margin-bottom:1px}
.card.mini .bs{font-size:11.5px;margin-top:1px}
.pc{display:block;font:500 12px/1.2 Barlow,sans-serif;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcode{display:inline-block;font:600 13px Barlow,sans-serif;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;align-self:flex-start}
.deliv{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:10px;padding:8px 12px}
.card.mini .dl{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font:600 11px Barlow,sans-serif;padding:3px 8px;border-radius:999px;z-index:1}
@media (min-width:900px){.card.mini h2{font-size:16.5px}.card.mini .tile{height:210px}}
#pdlg .body{padding:16px 18px 20px;gap:14px}
#pdlg .buy{margin-top:6px}
#pdlg .body .wa{margin-top:0}
</style>
</head>
<body>
<div id="boot" style="padding:70px 16px;text-align:center;color:#5d6573;font:16px system-ui,sans-serif">Cargando catálogo… (v14)</div>
<div class="adm" id="adm" hidden><b>Modo administrador</b>
  <button class="ab" id="b_mode">✏️ Editar catálogo</button><button class="ab" id="b_new" hidden>➕ Producto nuevo</button>
  <button class="ab" id="b_cfg" hidden>⚙️ Mi tienda</button><button class="ab ghost" id="b_out">Salir</button></div>
<div class="ticker" id="tick" hidden><div class="tk" id="tk"></div></div>
<div class="wrap" id="app" hidden>
  <header class="hero" id="hero"><button class="atop" id="b_login2" aria-label="Acceso administrador">⚙︎ Admin</button>
    <div class="cover" id="cover" hidden><img id="coverimg" alt=""></div>
    <div class="brand"><img class="logo" id="logo" alt="" hidden>
      <div class="bt"><h1 id="sname"></h1><p id="stag"></p>
        <div class="count" hidden><b id="total">0</b></div></div></div></header>
  <div class="mq" id="mq" hidden><div class="mqt" id="mqt"></div></div>
  <div class="bar"><input class="search" id="q" type="search" placeholder="Buscar productos…" aria-label="Buscar"><div class="chips" id="chips"></div></div>
  <main class="grid" id="grid"></main>
  <footer><button class="mini" id="b_login">Administrar</button></footer>
</div>
<div class="wrap msg" id="msg" hidden><h1 id="mt"></h1><p id="mp"></p><button class="ab" id="b_login0">Soy administrador</button></div>
<a class="fab" id="fab" target="_blank" rel="noopener" hidden>💬 Consultar</a>
<dialog id="dlg"><div id="dbody"></div><div class="dbtn"><button class="ab" id="d_ok">Guardar</button><button class="ab ghost" id="d_x">Cancelar</button><button class="ab danger" id="d_del" hidden>Eliminar</button></div></dialog>
<dialog id="cdlg"><div id="cbody"></div><div class="dbtn"><a class="ab" id="c_send" target="_blank" rel="noopener" style="text-decoration:none;background:#1fa855">Enviar pedido por WhatsApp</a><button class="ab ghost" id="c_x">Seguir comprando</button></div></dialog>
<dialog id="pdlg"><button class="pclose" id="pclose" aria-label="Cerrar">✕</button><article class="card" id="pcard"></article><div id="ptoast" hidden></div></dialog>
<button class="cartbtn" id="cartbtn" hidden></button>
<div class="toast" id="toast" hidden></div>

<script>
function showErr(t){var b=document.getElementById("boot");if(b)b.remove();var m=document.getElementById("msg");if(!m)return;document.getElementById("app").hidden=true;document.getElementById("mt").textContent="Algo salió mal";document.getElementById("mp").textContent=t;m.hidden=false}
window.addEventListener("error",function(e){if(e.target&&e.target.src){showErr("No se pudo descargar: "+e.target.src);return}showErr((e.message||"Error")+" "+String(e.filename||"").split("/").pop()+":"+(e.lineno||""))});
setTimeout(function(){var b=document.getElementById("boot");if(b){showErr("La página no pudo iniciar. Se detuvo en: "+(window.__step||"inicio")+" (v14)")}},40000);
window.addEventListener("unhandledrejection",function(e){var r=e.reason;showErr(String((r&&(r.code||r.message))||r))});
</script>
<script type="module">
const DEFAULT_TAG="Elige tu producto, mira cuántos quedan y haz tu pedido por WhatsApp.";

function fitImg(f,w,h,mode,type,q){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{

  const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,(w-im.width*k)/2,(h-im.height*k)/2,im.width*k,im.height*k);
  let d=c.toDataURL(type,q);if(type==="image/webp"&&d.indexOf("data:image/webp")!==0)d=c.toDataURL("image/png");URL.revokeObjectURL(u);ok(d)};im.onerror=no;im.src=u})}
function storeForm(){const c=ed.c;$("dbody").innerHTML=`<h2>Mi tienda</h2><br>
<div class="fl">Logo del negocio (opcional): se muestra arriba, junto al nombre<div class="lgp">${c.logo?`<img class="l" src="${esc(c.logo)}" alt="">`:""}<input id="f_logo" type="file" accept="image/*">${c.logo?`<button class="mini" data-d="rmlogo">Quitar logo</button>`:""}</div></div>
<div class="fl">Foto de portada o banner (opcional): imagen ancha arriba de la página, ideal 1600×560<div class="lgp">${c.cover?`<img class="c" src="${esc(c.cover)}" alt="">`:""}<input id="f_cover" type="file" accept="image/*">${c.cover?`<button class="mini" data-d="rmcover">Quitar portada</button>`:""}</div></div>
<label>Nombre<input data-s="name" value="${esc(c.name)}"></label><label>Texto debajo del título<textarea data-s="tagline" rows="3">${esc(c.tagline||"")}</textarea></label><label>Barra en movimiento (texto que se desplaza; déjala vacía para ocultarla)<textarea data-s="banner" rows="2" placeholder="Ej: Envíos gratis esta semana · Nuevos productos">${esc(c.banner||"")}</textarea></label><label>WhatsApp (código de país + número, sin + ni 0 inicial. Ej: 584221420364)<input data-s="whatsapp" inputmode="numeric" value="${esc(c.whatsapp)}"></label><label>Moneda<input data-s="currency" value="${esc(c.currency)}"></label><label>Nombre de las opciones de cada producto (Talla, Medida, Presentación…)<input data-s="optLabel" value="${esc(c.optLabel||"Talla")}"></label><label>Color de la marca<input data-s="color" type="color" value="${esc(c.color||"#2a45ff")}"></label><button class="mini" data-d="chpw">Cambiar clave</button>`}
$("dbody").addEventListener("change",async e=>{
  const id=e.target.id;if((id!=="f_logo"&&id!=="f_cover")||!e.target.files.length||!ed||ed.mode!=="store")return;
  const f=e.target.files[0];
  try{toast("Procesando imagen…",15000);
    if(id==="f_logo")ed.c.logo=await fitImg(f,320,320,"contain","image/webp",.9);
    else{let u=await fitImg(f,1600,560,"cover","image/jpeg",.78);if(u.length>520000)u=await fitImg(f,1200,420,"cover","image/jpeg",.62);ed.c.cover=u}
    storeForm();toast("Imagen lista ✔")}catch(err){toast("No se pudo procesar la imagen")}
});
function shrink(f,max,q){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=no;im.src=URL.createObjectURL(f)})}
$("dbody").addEventListener("change",async e=>{
  if(e.target.id!=="f_img"||!e.target.files.length)return;
  const w=ed.w;w.imgs=w.imgs||[];
  try{toast("Procesando fotos…",15000);
    for(const f of [...e.target.files]){
      if(w.imgs.length>=5){toast("Máximo 5 fotos");break}
      let u=await shrink(f,720,.68);if(u.length>150000)u=await shrink(f,560,.55);
      if(w.imgs.reduce((a,x)=>a+x.length,0)+u.length>800000){toast("Ya no caben más fotos en este producto");break}
      w.imgs.push(u);
    }
    form();toast("Fotos listas ✔")}catch(err){toast("No se pudo procesar la foto")}
});
$("d_x").onclick=async()=>{if(ed&&ed.mode==="newpw"&&ed.force){await signOut(auth);try{localStorage.removeItem("mustpw")}catch(e){}location.reload();return}$("dlg").close()};
$("d_ok").onclick=async()=>{
  if(ed.mode==="login"){const pw=$("f_pw").value;
    try{await signInWithEmailAndPassword(auth,toEmail($("f_em").value),pw)}catch(err){return toast("Usuario o clave incorrectos",3500)}
    if(pw===DEFAULT_PW){try{localStorage.setItem("mustpw","1")}catch(e){}openPw(true);return}
    return location.reload()}
  if(ed.mode==="newpw"){const a=$("f_n1").value,b=$("f_n2").value;
    if(a.length<8)return toast("Mínimo 8 caracteres");
    if(a===DEFAULT_PW)return toast("Elige una clave distinta a la inicial");
    if(a!==b)return toast("Las claves no coinciden");
    try{await updatePassword(auth.currentUser,a)}catch(err){return toast("No se pudo cambiar la clave. Entra de nuevo e inténtalo.",5000)}
    try{localStorage.removeItem("mustpw")}catch(e){}
    $("dlg").close();toast("Clave actualizada ✔");if(ed.force)setTimeout(()=>location.reload(),900);return}
  if(ed.mode==="store"){const c=ed.c,wa=String(c.whatsapp).replace(/\D/g,"");if(!c.name.trim()||!wa)return toast("Revisa el nombre y el WhatsApp");
    if((c.logo||"").length+(c.cover||"").length>850000)return toast("Las imágenes pesan demasiado: usa una portada más liviana",5000);
    try{await updateDoc(doc(db,"stores",store.id),{name:c.name.trim(),whatsapp:wa,currency:c.currency||"$",color:c.color,tagline:(c.tagline||"").trim(),banner:(c.banner||"").trim(),optLabel:((c.optLabel||"").trim()||"Talla"),logo:c.logo||"",cover:c.cover||""})}catch(err){return toast("No se pudo guardar",4000)}return location.reload()}
  const w=ed.w;if(!w.name.trim())return toast("Ponle un nombre al producto");
  const sizes={};w.sz.forEach(([k,v])=>{k=String(k).trim().replace(/\//g,"-");if(k)sizes[k]=v});
  if(!Object.keys(sizes).length){const n=String(w.noStock??"").trim();sizes[NOOPT]=n===""?9999:Math.max(0,Math.min(9998,parseInt(n)||0))}
  const row={name:w.name.trim(),category:(w.category||"").trim()||"Otros",description:w.description||"",price:w.price||0,discount:Math.max(0,Math.min(95,Math.round(+w.discount||0))),code:(w.code||"").trim(),delivery:!!w.delivery,deliveryNote:w.delivery?(w.deliveryNote||"").trim():"",icon:w.icon||"🏷️",image_url:"",images:w.imgs||[],colors:w.colors.map(c=>({n:c[0]||"Color",c1:c[1],c2:c[2]})),sizes,active:w.active,created:w.created||Date.now()};
  try{if(w.id)await setDoc(doc(db,"stores",store.id,"products",w.id),row);else await addDoc(collection(db,"stores",store.id,"products"),row)}
  catch(err){return toast("No se pudo guardar: "+(err.code||""),5000)}
  $("dlg").close();await loadProducts();toast("Guardado ✔");
};
$("d_del").onclick=async function(){
  if(!this.dataset.s){this.dataset.s=1;this.textContent="¿Seguro? Toca otra vez";return}
  try{await deleteDoc(doc(db,"stores",store.id,"products",ed.w.id))}catch(err){$("dlg").close();return toast("No se pudo eliminar")}
  $("dlg").close();await loadProducts();toast("Producto eliminado");
};

let rate=0,rateDate="",CART=[],CK="cart";
try{const c=JSON.parse(localStorage.getItem("rate")||"null");if(c&&c.r>0){rate=c.r;rateDate=c.d}}catch(e){}
const fd=d=>d?d.split("-").reverse().join("/"):"";
const nf=n=>Number(n).toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2});
const dc=p=>{const d=Math.round(Number(p.discount)||0);return d>0&&d<100?d:0};
const pp=p=>dc(p)?Math.round(Number(p.price)*(100-dc(p)))/100:(Number(p.price)||0);
const bs=n=>rate?"Bs. "+nf(n*rate):"";
function showRate(){
  const t=$("tick");
  if(!rate){t.hidden=true;return}
  const one="<span>💱 Tasa BCV de hoy</span><span><b>Bs. "+nf(rate)+"</b> por 1 US$</span>"+(rateDate?"<span>Actualizada "+fd(rateDate)+"</span>":"")+"<span>✦</span>";
  $("tk").innerHTML=one.repeat(8);t.hidden=false;
}
async function getJ(u,pick){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});return pick(await r.json())}finally{clearTimeout(t)}}
async function loadRate(){
  showRate();
  let g=null;
  try{g=await getJ("https://ve.dolarapi.com/v1/dolares/oficial",j=>({r:+j.promedio,d:String(j.fechaActualizacion||"").slice(0,10)}))}catch(e){}
  if(!g||!(g.r>0)){try{g=await getJ("https://chitty400.github.io/chitty-bcv-api/latest.json",j=>({r:+j.tasa_bcv,d:String(j.updated_at||"").slice(0,10)}))}catch(e){}}
  if(g&&g.r>0){rate=g.r;rateDate=g.d;try{localStorage.setItem("rate",JSON.stringify(g))}catch(e){}}
  showRate();render();cartUI();
}
function loadCart(){try{CART=JSON.parse(localStorage.getItem(CK)||"[]")}catch(e){CART=[]}}
function saveCart(){try{localStorage.setItem(CK,JSON.stringify(CART))}catch(e){}}
const cartTotal=()=>CART.reduce((a,x)=>{const p=P.find(y=>y.id===x.id);return a+(p?pp(p)*x.q:0)},0);
function cartUI(){const n=CART.reduce((a,x)=>a+x.q,0),b=$("cartbtn");b.hidden=!n;b.textContent="🛒 "+n+" · "+fmt(cartTotal())}
function addCart(p,s){
  const col=p.colors.length?(p.colors[s.c]||[""])[0]:"",max=p.sizes[s.sz]||0,it=CART.find(x=>x.id===p.id&&x.c===col&&x.s===s.sz),nq=(it?it.q:0)+s.q;
  if(nq>max){toast("Solo hay "+max+" disponibles de esa opción");return}
  if(it)it.q=nq;else CART.push({id:p.id,c:col,s:s.sz,q:s.q});
  saveCart();cartUI();toast("Agregado al carrito 🛒");
}
function msgCart(){
  const t=cartTotal();
  const L=CART.map((x,i)=>{const p=P.find(y=>y.id===x.id),sub=pp(p)*x.q;return (i+1)+". "+p.name+(x.c?" ("+x.c+")":"")+(p.code?" [Cód. "+p.code+"]":"")+(x.s!==NOOPT?" - "+OL()+" "+x.s:"")+" x"+x.q+" = "+fmt(sub)+(rate?" ("+bs(sub)+")":"")}).join("\n");
  return "¡Hola! Quiero hacer este pedido:\n"+L+"\n\nTotal: "+fmt(t)+(rate?" ("+bs(t)+")":"")+(rate?"\nTasa BCV: "+nf(rate)+(rateDate?" ("+fd(rateDate)+")":""):"")+"\n¿Está disponible?";
}
function drawCart(){
  CART.forEach(x=>{const p=P.find(y=>y.id===x.id);if(p)x.q=Math.min(x.q,p.sizes[x.s]||0)});
  CART=CART.filter(x=>x.q>0&&P.some(p=>p.id===x.id));saveCart();
  const rows=CART.map((x,i)=>{const p=P.find(y=>y.id===x.id);return `<div class="ci"><div class="t"><b>${esc(p.name)}</b><small>${[x.c,x.s!==NOOPT?OL()+" "+x.s:""].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</small><small>${fmt(pp(p))} c/u${dc(p)?` · antes <s>${fmt(p.price)}</s> (−${dc(p)}%)`:""}</small></div><div class="qty"><button data-c="m" data-i="${i}">−</button><span>${x.q}</span><button data-c="p" data-i="${i}">+</button></div><button class="mini" data-c="x" data-i="${i}" aria-label="Quitar">✕</button></div>`}).join("");
  const t=cartTotal();
  $("cbody").innerHTML=`<h2>Tu pedido</h2>${rows||'<p class="desc">El carrito está vacío.</p>'}<div class="tot">Total: ${fmt(t)}</div>${rate?`<div class="desc">${bs(t)} · tasa BCV ${nf(rate)}</div>`:""}${CART.length?'<p><button class="mini" data-c="clear">Vaciar carrito</button></p>':""}`;
  $("c_send").hidden=!CART.length;$("c_send").href=link(msgCart());cartUI();
}
$("cartbtn").onclick=()=>{drawCart();$("cdlg").showModal()};
$("c_x").onclick=()=>$("cdlg").close();
$("cbody").addEventListener("click",e=>{
  const b=e.target.closest("[data-c]");if(!b)return;const c=b.dataset.c,i=+b.dataset.i,x=CART[i];
  if(c==="clear")CART=[];
  else if(c==="x")CART.splice(i,1);
  else{const p=P.find(y=>y.id===x.id),max=p?(p.sizes[x.s]||0):0;if(c==="m")x.q=Math.max(1,x.q-1);if(c==="p")x.q=Math.min(max,x.q+1)}
  saveCart();drawCart();
});

function showBanner(){
  const t=(store.banner||"").trim(),m=$("mq");
  if(!t){m.hidden=true;return}
  $("mqt").innerHTML=("<span>"+esc(t)+"</span><span>✦</span>").repeat(16);
  $("mqt").style.animationDuration=Math.max(20,Math.round(t.length*1.2+12))+"s";
  m.hidden=false;
}
function openPw(force){
  ed={mode:"newpw",force};$("d_del").hidden=true;$("d_ok").textContent="Guardar clave";
  $("dbody").innerHTML='<h2>'+(force?"Crea tu clave nueva":"Cambiar clave")+'</h2><br><p class="desc">'+(force?"Por seguridad, cambia la clave inicial antes de continuar.":"Mínimo 8 caracteres.")+'</p><label>Clave nueva<input id="f_n1" type="password" autocomplete="new-password"></label><label>Repite la clave<input id="f_n2" type="password" autocomplete="new-password"></label>';
  if(!$("dlg").open)$("dlg").showModal();
}
$("dlg").addEventListener("cancel",e=>{if(ed&&ed.mode==="newpw"&&ed.force)e.preventDefault()});
boot().catch(e=>msg("Error al cargar",String((e&&(e.code||e.message))||e)));
setTimeout(()=>{if($("app").hidden&&$("msg").hidden)msg("No se pudo conectar con Firebase","Revisa tu conexión a internet y que los datos de firebaseConfig estén bien.")},9000);
</script>
