<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Deportivo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#12151b;--mut:#5d6573;--line:#d9dde4;--acc:#2a45ff;--warn:#ff5a1f;--ok:#12a150}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--ink:#f1f3f7;--mut:#9aa3b2;--line:#2a303c;--ok:#3ddc84}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
h1{font:italic 800 clamp(40px,10vw,80px)/.92 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;margin:30px 0 8px}
.sub{color:var(--mut);margin:0 0 14px;max-width:46ch}
.count{display:inline-flex;gap:8px;align-items:baseline;padding:8px 14px;border:2px solid var(--ink);border-radius:999px;font-weight:600}
.count b{font:italic 800 30px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin-top:14px;border-bottom:1px solid var(--line)}
input{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,sans-serif}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:600 14px Barlow,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:20px 0 90px}
.card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tile{height:200px;display:grid;place-items:center;position:relative;overflow:hidden}
.tile i{font-style:normal;font-size:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;background:var(--warn);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
.badge.out{background:#444}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.top{display:flex;justify-content:space-between;gap:10px}
h2{font:italic 800 26px/1 'Barlow Condensed',sans-serif;margin:0;text-transform:uppercase}
.price{font:italic 800 24px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.desc{margin:0;color:var(--mut);font-size:14px}
.lbl{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sz{min-width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 14px Barlow,sans-serif;cursor:pointer}
.sz.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.stock{display:flex;align-items:center;gap:10px;font-size:14px}
.meter{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter u{display:block;height:100%;background:var(--ok);border-radius:9px}
.meter u.low{background:var(--warn)}
.buy{display:flex;gap:10px;margin-top:auto}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px}
.qty button{width:36px;height:46px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.wa{flex:1;display:flex;align-items:center;justify-content:center;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;border-radius:12px;height:46px}
.wa.off{background:var(--line);color:var(--mut);pointer-events:none}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
.fab{position:fixed;right:16px;bottom:16px;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;padding:14px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="nombre">Catálogo</h1>
  <p class="sub">Elige tu prenda, talla y color. Mira cuántas quedan y haz tu pedido por WhatsApp.</p>
  <div class="count"><b id="total">0</b> prendas disponibles</div>
  <div class="bar"><input id="q" type="search" placeholder="Buscar prendas…"><div class="chips" id="chips"></div></div>
  <main class="grid" id="grid"></main>
</div>
<a class="fab" id="fab" target="_blank" rel="noopener">💬 Consultar</a>

<script>
window.onerror=function(m){var d=document.createElement("div");d.style.cssText="padding:10px;background:#fee;color:#900;font:14px sans-serif";d.textContent="Error: "+m;document.body.insertBefore(d,document.body.firstChild)};

/* ===== EDITA AQUÍ: WA = tu WhatsApp con código de país, sin + ni 0 ===== */
const WA = "584221420364";
const MONEDA = "$";
const NOMBRE = "Mi Catálogo";
/* Cada producto: nombre, categoría, emoji, foto (url o vacío), precio, descripción, colores y tallas con su cantidad */
const PRODUCTOS = [
 {n:"Camiseta Aero",cat:"Camisetas",icon:"👕",img:"",precio:19.9,desc:"Tela ligera que respira y seca rápido. Ideal para correr y gym.",
  colores:[["Azul","#2a45ff","#7b8cff"],["Negro","#1b1e26","#4a5060"],["Coral","#ff5a1f","#ffa06b"]],tallas:{XS:3,S:8,M:12,L:6,XL:0}},
 {n:"Short Sprint",cat:"Shorts",icon:"🩳",img:"",precio:16.5,desc:"Corte ligero con bolsillo interno y malla transpirable.",
  colores:[["Negro","#1b1e26","#4a5060"],["Verde","#0f9d58","#6fe3a3"]],tallas:{S:2,M:5,L:9,XL:4}},
 {n:"Leggings Flex",cat:"Leggings",icon:"🩱",img:"",precio:27.9,desc:"Cintura alta, compresión media y costuras planas que no rozan.",
  colores:[["Morado","#6a2cff","#b695ff"],["Negro","#1b1e26","#4a5060"]],tallas:{XS:5,S:10,M:7,L:2}},
 {n:"Sudadera Pro",cat:"Sudaderas",icon:"🧥",img:"",precio:42,desc:"Felpa suave por dentro, capucha ajustable y bolsillo canguro.",
  colores:[["Gris","#59616f","#aab2c0"],["Azul","#2a45ff","#7b8cff"]],tallas:{S:1,M:3,L:5,XL:2}}
];
/* ===== FIN DE LO QUE SE EDITA ===== */

const $=id=>document.getElementById(id);
const fmt=n=>MONEDA+n.toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2});
const S=PRODUCTOS.map(p=>({c:0,q:1,t:Object.keys(p.tallas).find(k=>p.tallas[k]>0)||null}));
let cat="Todo",term="";

function card(i){
  const p=PRODUCTOS[i],s=S[i],st=s.t?p.tallas[s.t]:0,c=p.colores[s.c],low=st>0&&st<=3;
  const m=`¡Hola! Quiero comprar:\n• ${p.n} (${c[0]})\n• Talla: ${s.t}\n• Cantidad: ${s.q}\n• Total: ${fmt(p.precio*s.q)}\n¿Sigue disponible?`;
  return `<div class="tile" style="background:linear-gradient(135deg,${c[1]},${c[2]})">${p.img?`<img src="${p.img}" alt="${p.n}">`:`<i>${p.icon}</i>`}${!s.t?'<b class="badge out">Agotado</b>':low?`<b class="badge">¡Últimas ${st}!</b>`:''}</div>
  <div class="body">
    <div class="top"><h2>${p.n}</h2><div class="price">${fmt(p.precio)}</div></div>
    <p class="desc">${p.desc}</p>
    <div><span class="lbl">Color: ${c[0]}</span><div class="row">${p.colores.map((x,k)=>`<button class="sw ${k===s.c?'on':''}" data-a="c" data-v="${k}" aria-label="${x[0]}" style="background:linear-gradient(135deg,${x[1]},${x[2]})"></button>`).join("")}</div></div>
    <div><span class="lbl">Talla</span><div class="row">${Object.entries(p.tallas).map(([k,v])=>`<button class="sz ${k===s.t?'on':''}" data-a="t" data-v="${k}" ${v?'':'disabled'}>${k}</button>`).join("")}</div></div>
    <div class="stock"><span><b>${st}</b> disponibles</span><div class="meter"><u class="${low?'low':''}" style="width:${Math.min(100,st/12*100)}%"></u></div></div>
    <div class="buy"><div class="qty"><button data-a="m">−</button><span>${s.q}</span><button data-a="p">+</button></div>
    ${s.t?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(m)}">Comprar por WhatsApp</a>`:'<a class="wa off">Sin stock</a>'}</div>
  </div>`;
}
function render(){
  const idx=PRODUCTOS.map((p,i)=>i).filter(i=>{const p=PRODUCTOS[i];return (cat==="Todo"||p.cat===cat)&&(p.n+p.desc+p.cat).toLowerCase().includes(term)});
  $("grid").innerHTML=idx.length?idx.map(i=>`<article class="card" data-i="${i}">${card(i)}</article>`).join(""):'<div class="empty">No encontramos prendas 🔎</div>';
}
$("grid").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const el=b.closest(".card"),i=+el.dataset.i,p=PRODUCTOS[i],s=S[i],a=b.dataset.a;
  if(a==="c")s.c=+b.dataset.v;
  if(a==="t"){s.t=b.dataset.v;s.q=1}
  if(a==="m")s.q=Math.max(1,s.q-1);
  if(a==="p")s.q=Math.min(p.tallas[s.t]||1,s.q+1);
  el.innerHTML=card(i);
});
$("q").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();render()});
const cats=["Todo",...new Set(PRODUCTOS.map(p=>p.cat))];
$("chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}">${c}</button>`).join("");
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;cat=b.textContent;
  $("chips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));render();
});
$("nombre").textContent=NOMBRE;document.title=NOMBRE;
$("fab").href="https://wa.me/"+WA+"?text="+encodeURIComponent("¡Hola! Vi el catálogo y tengo una consulta.");
const T=PRODUCTOS.reduce((a,p)=>a+Object.values(p.tallas).reduce((x,y)=>x+y,0),0);let n=0;
const t=setInterval(()=>{n+=Math.ceil(T/30);if(n>=T){n=T;clearInterval(t)}$("total").textContent=n},35);
render();
</script>
</body>
</html>
