<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#12151b;--mut:#5d6573;--line:#d9dde4;--acc:#2a45ff;--on:#fff;--warn:#ff5a1f;--ok:#12a150;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--ink:#f1f3f7;--mut:#9aa3b2;--line:#2a303c;--ok:#3ddc84}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hero{padding:30px 0 16px}
h1{font:italic 800 clamp(38px,10vw,80px)/.92 'Barlow Condensed',Impact,sans-serif;margin:0;text-transform:uppercase}
.hero p{color:var(--mut);margin:10px 0 0;max-width:46ch}
.count{display:inline-flex;align-items:baseline;gap:8px;margin-top:14px;padding:8px 14px;border:2px solid var(--ink);border-radius:999px;font-weight:600}
.count b{font:italic 800 30px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.search,dialog input,dialog textarea{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow,sans-serif}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:600 14px Barlow,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:20px 0 40px}
.card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.tile{height:200px;display:grid;place-items:center;position:relative;overflow:hidden;transition:background .4s}
.tile i{font-style:normal;font-size:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));transition:transform .3s}
.card:hover .tile i{transform:rotate(-8deg) scale(1.1)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .tile img{transform:scale(1.05)}
.badge{position:absolute;top:12px;left:12px;background:var(--warn);color:#fff;font:700 12px Barlow,sans-serif;padding:4px 10px;border-radius:999px}
.badge.out{background:#444}
.edit{position:absolute;top:12px;right:12px;z-index:2;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 12px;font:600 13px Barlow,sans-serif;cursor:pointer}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h2{font:italic 800 26px/1 'Barlow Condensed',sans-serif;margin:0;text-transform:uppercase}
.price{font:italic 800 24px/1 'Barlow Condensed',sans-serif;color:var(--acc)}
.desc{margin:0;color:var(--mut);font-size:14px}
.lbl{font-size:13px;color:var(--mut);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sz{min-width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 14px Barlow,sans-serif;cursor:pointer}
.sz.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.stock{display:flex;align-items:center;gap:10px;font-size:14px}
.meter{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter u{display:block;height:100%;background:var(--ok);transition:width .4s;border-radius:9px}
.meter u.low{background:var(--warn)}
.buy{display:flex;gap:10px;margin-top:auto}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px}
.qty button{width:36px;height:46px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.wa{flex:1;display:flex;align-items:center;justify-content:center;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;border-radius:12px;height:46px}
.wa.off{background:var(--line);color:var(--mut);pointer-events:none}
.empty,.msg{text-align:center;color:var(--mut);padding:60px 0;grid-column:1/-1}
.msg h1{color:var(--ink);margin-bottom:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1fa855;color:#fff;text-decoration:none;font-weight:600;padding:14px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
footer{text-align:center;padding:10px 0 90px}
.adm{background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ab{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:9px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
.ab.ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}
.ab.danger{background:var(--warn);color:#fff}
.mini{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:600 13px Barlow,sans-serif;cursor:pointer;margin-right:6px}
dialog{width:min(520px,94vw);max-height:90vh;border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:18px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog label,.fl{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
dialog input,dialog textarea{margin-top:4px;background:var(--bg)}
.r{display:flex;gap:8px;margin:6px 0;align-items:center}.r input{margin-top:0}
.r input[type=color]{width:52px;height:42px;padding:2px;flex:none}.r input[type=number]{width:90px;flex:none}
dialog input[type=checkbox]{width:auto;margin-right:8px}
.pv{display:block;width:120px;height:120px;object-fit:cover;border-radius:12px;margin:6px 0}
.dbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:20;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot" style="padding:70px 16px;text-align:center;color:#5d6573;font:16px system-ui,sans-serif">Cargando catálogo… (v4)</div>
<div class="adm" id="adm" hidden><b>Modo administrador</b>
  <button class="ab" id="b_mode">✏️ Editar catálogo</button><button class="ab" id="b_new" hidden>➕ Producto nuevo</button>
  <button class="ab" id="b_cfg" hidden>⚙️ Mi tienda</button><button class="ab ghost" id="b_out">Salir</button></div>
<div class="wrap" id="app" hidden>
  <header class="hero"><h1 id="sname"></h1><p>Elige tu prenda, talla y color. Mira cuántas quedan y haz tu pedido por WhatsApp.</p>
    <div class="count"><b id="total">0</b> prendas disponibles ahora</div></header>
  <div class="bar"><input class="search" id="q" type="search" placeholder="Buscar prendas…" aria-label="Buscar"><div class="chips" id="chips"></div></div>
  <main class="grid" id="grid"></main>
  <footer><button class="mini" id="b_login">Administrar</button></footer>
</div>
<div class="wrap msg" id="msg" hidden><h1 id="mt"></h1><p id="mp"></p><button class="ab" id="b_login0">Soy administrador</button></div>
<a class="fab" id="fab" target="_blank" rel="noopener" hidden>💬 Consultar</a>
<dialog id="dlg"><div id="dbody"></div><div class="dbtn"><button class="ab" id="d_ok">Guardar</button><button class="ab ghost" id="d_x">Cancelar</button><button class="ab danger" id="d_del" hidden>Eliminar</button></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
function showErr(t){var b=document.getElementById("boot");if(b)b.remove();var m=document.getElementById("msg");if(!m)return;document.getElementById("app").hidden=true;document.getElementById("mt").textContent="Algo salió mal";document.getElementById("mp").textContent=t;m.hidden=false}
window.addEventListener("error",function(e){if(e.target&&e.target.src){showErr("No se pudo descargar: "+e.target.src);return}showErr((e.message||"Error")+" "+String(e.filename||"").split("/").pop()+":"+(e.lineno||""))});
setTimeout(function(){var b=document.getElementById("boot");if(b){showErr("La página no pudo iniciar. Se detuvo en: "+(window.__step||"inicio")+" (v4)")}},15000);
window.addEventListener("unhandledrejection",function(e){var r=e.reason;showErr(String((r&&(r.code||r.message))||r))});
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,collection,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ====== PEGA AQUÍ LOS DATOS DE TU PROYECTO FIREBASE (Configuración del proyecto > Tus apps > Web) ======
const firebaseConfig = {
  apiKey: "AIzaSyBTpdcqisXipgG9S9dyx3hovBBli4mfsmQ",
  authDomain: "catalogodigital-fcb99.firebaseapp.com",
  projectId: "catalogodigital-fcb99",
  appId: "1:100908240312:web:51f477109c7ada89e8534d"
};
// =====================================================================================================
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=initializeFirestore(app,{experimentalForceLongPolling:true});
const step=t=>{window.__step=t;const b=document.getElementById("boot");if(b)b.textContent="Cargando catálogo… "+t+" (v4)"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const light=h=>"#"+[1,3,5].map(i=>{const v=parseInt(h.substr(i,2),16);return Math.round(v+(255-v)*.45).toString(16).padStart(2,"0")}).join("");
let store=null,P=[],S={},cat="Todo",term="",ADMIN=false,OWNER=false,ed=null,counted=false;
const fmt=n=>(store.currency||"$")+Number(n).toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2});
const link=m=>`https://wa.me/${store.whatsapp}?text=${encodeURIComponent(m)}`;
const total=p=>Object.values(p.sizes).reduce((a,b)=>a+b,0);
function toast(m,ms){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,ms||2500)}
function msg(t,p){const b=document.getElementById("boot");if(b)b.remove();$("app").hidden=true;$("msg").hidden=false;$("mt").textContent=t;$("mp").textContent=p}

function initS(p){const s=S[p.id]=S[p.id]||{c:0,q:1,sz:null};
  if(!s.sz||!(s.sz in p.sizes))s.sz=Object.keys(p.sizes).find(k=>p.sizes[k]>0)||null;
  if(s.c>=p.colors.length)s.c=0}

function inner(p){
  const s=S[p.id],st=s.sz?p.sizes[s.sz]:0,col=p.colors[s.c]||["Único","#2a45ff","#7b8cff"],low=st>0&&st<=3;
  const m=`¡Hola! Quiero comprar:\n• ${p.name} (${col[0]})\n• Talla: ${s.sz}\n• Cantidad: ${s.q}\n• Total: ${fmt(p.price*s.q)}\n¿Sigue disponible?`;
  return `<div class="tile" style="background:linear-gradient(135deg,${col[1]},${col[2]})">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:`<i>${esc(p.icon||"🏷️")}</i>`}
   ${!p.active?'<span class="badge out">Oculto</span>':!s.sz?'<span class="badge out">Agotado</span>':low?`<span class="badge">¡Últimas ${st}!</span>`:''}${ADMIN?'<button class="edit" data-a="e">✏️ Editar</button>':''}</div>
  <div class="body"><div class="top"><h2>${esc(p.name)}</h2><div class="price">${fmt(p.price)}</div></div>
  <p class="desc">${esc(p.description)}</p>
  <div><span class="lbl">Color: ${esc(col[0])}</span><div class="row">${p.colors.map((c,i)=>`<button class="sw ${i===s.c?'on':''}" data-a="c" data-v="${i}" aria-label="${esc(c[0])}" style="background:linear-gradient(135deg,${c[1]},${c[2]})"></button>`).join("")}</div></div>
  <div><span class="lbl">Talla</span><div class="row">${Object.entries(p.sizes).map(([k,v])=>`<button class="sz ${k===s.sz?'on':''}" data-a="s" data-v="${esc(k)}" ${v?'':'disabled title="Agotada"'}>${esc(k)}</button>`).join("")}</div></div>
  <div class="stock"><span><b>${st}</b> disponibles</span><div class="meter"><u class="${low?'low':''}" style="width:${Math.min(100,st/12*100)}%"></u></div></div>
  <div class="buy"><div class="qty"><button data-a="m" aria-label="Menos">−</button><span>${s.q}</span><button data-a="p" aria-label="Más">+</button></div>
  ${s.sz?`<a class="wa" target="_blank" rel="noopener" href="${link(m)}">Comprar por WhatsApp</a>`:'<a class="wa off">Sin stock</a>'}</div></div>`;
}
function render(){
  const l=P.filter(p=>(cat==="Todo"||p.category===cat)&&(p.name+p.description+p.category).toLowerCase().includes(term));
  $("grid").innerHTML=l.length?l.map(p=>`<article class="card" data-id="${p.id}">${inner(p)}</article>`).join(""):`<div class="empty">${P.length?"No encontramos prendas con esa búsqueda 🔎":ADMIN?"Aún no hay productos. Toca ➕ Producto nuevo.":"Pronto habrá productos aquí."}</div>`;
}
function chips(){const cs=["Todo",...new Set(P.map(p=>p.category))];if(!cs.includes(cat))cat="Todo";
  $("chips").innerHTML=cs.map(c=>`<button class="chip ${c===cat?'on':''}">${esc(c)}</button>`).join("")}
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.textContent;chips();render()});
$("q").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();render()});
$("grid").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const card=b.closest(".card"),p=P.find(x=>x.id===card.dataset.id),s=S[p.id],a=b.dataset.a;
  if(a==="e"){openProd(p.id);return}
  if(a==="c")s.c=+b.dataset.v; if(a==="s"){s.sz=b.dataset.v;s.q=1}
  if(a==="m")s.q=Math.max(1,s.q-1); if(a==="p")s.q=Math.min(p.sizes[s.sz]||1,s.q+1);
  card.innerHTML=inner(p);
});

async function loadProducts(){
  step("3/3 productos");
  const col=collection(db,"stores",store.id,"products");
  const r=await getDocs(OWNER?col:query(col,where("active","==",true)));
  P=r.docs.map(d=>{const x=d.data();return {...x,id:d.id,colors:(x.colors||[]).map(c=>[c.n,c.c1,c.c2]),sizes:x.sizes||{},created:x.created||0}}).sort((a,b)=>a.created-b.created);
  P.forEach(initS);chips();render();
  const T=P.filter(p=>p.active).reduce((a,p)=>a+total(p),0);
  if(counted){$("total").textContent=T;return}counted=true;let n=0;
  const t=setInterval(()=>{n+=Math.ceil(T/30)||1;if(n>=T){n=T;clearInterval(t)}$("total").textContent=n},35);
}
async function boot(){
  step("1/3 sesión");
  const user=await new Promise(r=>{const u=onAuthStateChanged(auth,x=>{u();r(x)})});
  let slug=new URLSearchParams(location.search).get("tienda");
  if(!slug&&user){const q=await getDocs(query(collection(db,"stores"),where("owner","==",user.uid)));
    if(q.docs[0]){slug=q.docs[0].id;history.replaceState(null,"","?tienda="+slug)}}
  if(!slug)return msg("Falta el enlace de la tienda","Abre el enlace que te dio tu proveedor o entra como administrador.");
  step("2/3 tienda");
  let snap;try{snap=await getDoc(doc(db,"stores",slug))}catch(e){return msg("No se pudo cargar","Código del error: "+(e.code||e.message))}
  if(!snap.exists())return msg("Tienda no encontrada","No existe una tienda llamada «"+slug+"» en Firestore. Revisa el ID del documento en la colección stores.");
  store={id:snap.id,...snap.data()};OWNER=!!user&&store.owner===user.uid;
  document.title=store.name;$("sname").textContent=store.name;
  document.documentElement.style.setProperty("--acc",store.color||"#2a45ff");
  $("fab").href=link("¡Hola! Vi el catálogo y tengo una consulta.");$("fab").hidden=false;
  const b0=document.getElementById("boot");if(b0)b0.remove();$("app").hidden=false;$("adm").hidden=!OWNER;$("b_login").hidden=OWNER;
  await loadProducts();
}

// ---------- Administración ----------
$("b_login").onclick=$("b_login0").onclick=()=>{ed={mode:"login"};$("d_del").hidden=true;$("d_ok").textContent="Entrar";
  $("dbody").innerHTML=`<h2>Entrar como administrador</h2><br><label>Correo<input id="f_em" type="email" autocomplete="username"></label><label>Contraseña<input id="f_pw" type="password" autocomplete="current-password"></label><button class="mini" data-d="forgot">Olvidé mi contraseña</button>`;$("dlg").showModal()};
$("b_out").onclick=async()=>{await signOut(auth);location.reload()};
$("b_mode").onclick=()=>{ADMIN=!ADMIN;$("b_mode").textContent=ADMIN?"✔ Terminar edición":"✏️ Editar catálogo";$("b_new").hidden=$("b_cfg").hidden=!ADMIN;render()};
$("b_new").onclick=()=>openProd();
$("b_cfg").onclick=()=>{ed={mode:"store",c:{name:store.name,whatsapp:store.whatsapp,currency:store.currency,color:store.color}};$("d_del").hidden=true;$("d_ok").textContent="Guardar";
  $("dbody").innerHTML=`<h2>Mi tienda</h2><br><label>Nombre<input data-s="name" value="${esc(store.name)}"></label><label>WhatsApp (código de país + número, sin + ni 0 inicial. Ej: 584221420364)<input data-s="whatsapp" inputmode="numeric" value="${esc(store.whatsapp)}"></label><label>Moneda<input data-s="currency" value="${esc(store.currency)}"></label><label>Color de la marca<input data-s="color" type="color" value="${esc(store.color||"#2a45ff")}"></label>`;$("dlg").showModal()};

function openProd(id){
  const p=id?P.find(x=>x.id===id):{name:"",category:"",description:"",price:0,icon:"🏷️",image_url:"",active:true,colors:[["Negro","#1b1e26","#4a5060"]],sizes:{M:0}};
  const w=JSON.parse(JSON.stringify(p));w.sz=Object.entries(w.sizes);ed={mode:"prod",w};
  const d=$("d_del");d.hidden=!id;d.textContent="Eliminar";delete d.dataset.s;$("d_ok").textContent="Guardar";form();$("dlg").showModal();
}
function form(){const w=ed.w;$("dbody").innerHTML=`
 <label>Nombre<input id="f_name" value="${esc(w.name)}"></label>
 <label>Categoría<input id="f_category" list="cl" value="${esc(w.category)}"><datalist id="cl">${[...new Set(P.map(x=>x.category))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
 <label>Precio<input id="f_price" type="number" step="0.01" min="0" value="${w.price}"></label>
 <label>Descripción<textarea id="f_description" rows="3">${esc(w.description)}</textarea></label>
 <div class="fl">Foto${w.image_url?`<img class="pv" src="${esc(w.image_url)}" alt="">`:""}<input id="f_img" type="file" accept="image/*">${w.image_url?'<button class="mini" data-d="rmimg">Quitar foto</button>':""}</div>
 <label>Emoji (se ve si no hay foto)<input id="f_icon" maxlength="4" value="${esc(w.icon)}"></label>
 <div class="fl">Colores${w.colors.map((c,i)=>`<div class="r"><input data-k="cn" data-i="${i}" value="${esc(c[0])}"><input type="color" data-k="cc" data-i="${i}" value="${c[1]}"><button class="mini" data-d="rc" data-i="${i}">✕</button></div>`).join("")}<button class="mini" data-d="ac">+ Color</button></div>
 <div class="fl">Tallas y cuántas hay disponibles${w.sz.map(([k,v],i)=>`<div class="r"><input data-k="sn" data-i="${i}" value="${esc(k)}" placeholder="Talla"><input type="number" min="0" data-k="sq" data-i="${i}" value="${v}"><button class="mini" data-d="rs" data-i="${i}">✕</button></div>`).join("")}<button class="mini" data-d="as">+ Talla</button><button class="mini" data-d="pre">S, M, L, XL</button></div>
 <label><input type="checkbox" id="f_active" ${w.active?"checked":""}>Visible en el catálogo</label>`}
$("dbody").addEventListener("input",e=>{
